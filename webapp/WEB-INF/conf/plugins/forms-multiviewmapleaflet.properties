# Tile source of the multiview map. The defaults are carried by the provider bean, so these two keys only need
# to be set to point the map at another tile server — a corporate proxy, the Géoplateforme, a self-hosted one.
#
# Whichever host ends up here must also be allowed by the back-office Content-Security-Policy, which ships with
# `img-src 'self' data: blob:` and no tile host: see the README.
#
#forms-multiviewmapleaflet.tile.url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
#forms-multiviewmapleaflet.tile.attribution=Map data &copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors
